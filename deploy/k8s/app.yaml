apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: control-plane
          image: apollo-control-plane
          imagePullPolicy: IfNotPresent
          args: ["-grpc-address", ":50051", "-metrics-address", ":9090"]
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
          readinessProbe:
            exec:
              command: ["/healthcheck", "-address", "localhost:50051"]
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["/healthcheck", "-address", "localhost:50051"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: worker
          image: apollo-worker
          imagePullPolicy: IfNotPresent
          env:
            - name: APOLLO_SCHEDULER_ADDRESS
              value: control-plane:50051
            - name: APOLLO_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APOLLO_WORKER_CAPACITY
              value: "4"
            - name: APOLLO_METRICS_PORT
              value: "8000"
          ports:
            - name: metrics
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: "1"
              memory: 256Mi
