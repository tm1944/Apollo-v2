name: apollo

services:
  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    command: ["-grpc-address", ":50051", "-metrics-address", ":9090"]
    ports:
      - "50051:50051"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "/healthcheck", "-address", "localhost:50051"]
      interval: 3s
      timeout: 2s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      APOLLO_SCHEDULER_ADDRESS: control-plane:50051
      APOLLO_WORKER_CAPACITY: "4"
      APOLLO_METRICS_PORT: "8000"
    depends_on:
      control-plane:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      control-plane:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: apollo
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
