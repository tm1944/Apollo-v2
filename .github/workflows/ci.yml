name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.6
          cache-dependency-path: control-plane/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - run: pip install -r worker/requirements-dev.txt
      - name: Check protobuf contract and generated files
        run: |
          make lint-proto
          make generate
          git diff --exit-code
      - name: Test Go control plane
        working-directory: control-plane
        run: |
          go test -race ./...
          go vet ./...
      - name: Test Python worker and benchmark tools
        run: |
          ruff check worker bench scripts/compose-smoke.py
          mypy worker bench/summarize.py scripts/compose-smoke.py
          pytest -q
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2
      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy > /tmp/apollo-manifests.yaml
      - name: Build and smoke-test Compose stack
        run: |
          trap 'docker compose down --volumes' EXIT
          docker compose up --build --detach --wait --wait-timeout 180 --scale worker=2
          PYTHONPATH=worker/gen python scripts/compose-smoke.py --jobs 16
          curl --fail --silent http://localhost:9090/metrics | grep -q apollo_jobs_completed_total
          curl --fail --silent http://localhost:9091/-/ready
          curl --fail --silent http://localhost:3000/api/health
